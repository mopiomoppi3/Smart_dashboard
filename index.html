<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ========================================================
        // 1. 環境設定の取得 (Canvas内か外部公開用かを自動判定)
        // ========================================================
        let firebaseConfig;
        let initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'my-personal-dashboard';

        if (typeof __firebase_config !== 'undefined') {
            // Canvas環境（このプレビュー画面）での実行時
            firebaseConfig = JSON.parse(__firebase_config);
        } else {
            // ====================================================
            // 【重要】GitHub Pages等で公開する場合は、ここを自分の設定に書き換えてね！
            // ====================================================
            firebaseConfig = {
                apiKey: "YOUR_API_KEY",
                authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
                projectId: "YOUR_PROJECT_ID",
                storageBucket: "YOUR_PROJECT_ID.appspot.com",
                messagingSenderId: "YOUR_SENDER_ID",
                appId: "YOUR_APP_ID"
            };
        }

        // --- Firebase 初期化 ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // --- 認証処理 (RULE 3 準拠) ---
        const initAuth = async () => {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    if (firebaseConfig.apiKey === "YOUR_API_KEY") {
                        console.warn("Firebase API Key is still default. Please update your config.");
                        return;
                    }
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth Error:", error);
            }
        };
        initAuth();

        // 認証状態の監視
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                setupMemoListener();
                fetchNews();
                fetchWeather();
                fetchMusicCharts();
                
                setInterval(() => {
                    fetchNews();
                    fetchMusicCharts();
                }, 600000);
            }
        });

        // --- メモ同期 (RULE 1 準拠) ---
        function setupMemoListener() {
            if (!auth.currentUser) return;
            
            const memoRef = doc(db, 'artifacts', currentAppId, 'users', auth.currentUser.uid, 'settings', 'memo');
            const memoArea = document.getElementById('memo-area');
            
            onSnapshot(memoRef, (docSnap) => {
                if (docSnap.exists() && document.activeElement !== memoArea) {
                    memoArea.value = docSnap.data().text || '';
                }
            }, (error) => {
                console.error("Firestore Error:", error);
            });

            let timeout;
            memoArea.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(async () => {
                    if (auth.currentUser) {
                        try {
                            const ref = doc(db, 'artifacts', currentAppId, 'users', auth.currentUser.uid, 'settings', 'memo');
                            await setDoc(ref, { text: memoArea.value }, { merge: true });
                        } catch (e) {
                            console.error("Save failed:", e);
                        }
                    }
                }, 1000);
            });
        }

        // --- データ取得関数群 ---
        window.fetchMusicCharts = async () => {
            const chartContainer = document.getElementById('music-chart-list');
            const appleUrl = 'https://rss.applemarketingtools.com/api/v2/jp/music/most-played/10/songs.json';
            const proxies = [
                (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`
            ];

            for (const getProxyUrl of proxies) {
                try {
                    const response = await fetch(getProxyUrl(appleUrl));
                    if (!response.ok) continue;
                    let jsonData;
                    if (getProxyUrl.toString().includes('allorigins')) {
                        const raw = await response.json();
                        jsonData = JSON.parse(raw.contents);
                    } else {
                        jsonData = await response.json();
                    }
                    if (jsonData.feed && jsonData.feed.results) {
                        chartContainer.innerHTML = '';
                        jsonData.feed.results.forEach((song, index) => {
                            const row = document.createElement('div');
                            row.className = "flex items-center gap-3 p-2 hover:bg-white/5 rounded-xl transition group";
                            row.innerHTML = `
                                <span class="w-5 text-center font-bold text-slate-500 group-hover:text-blue-400 transition">${index + 1}</span>
                                <img src="${song.artworkUrl100}" class="w-10 h-10 rounded shadow-md" alt="art">
                                <div class="flex-1 min-w-0">
                                    <div class="text-sm font-bold truncate">${song.name}</div>
                                    <div class="text-xs text-slate-400 truncate">${song.artistName}</div>
                                </div>
                            `;
                            chartContainer.appendChild(row);
                        });
                        return;
                    }
                } catch (error) { console.warn("Proxy failed", error); }
            }
            chartContainer.innerHTML = `<div class="text-xs text-red-400 p-4">取得に失敗しました</div>`;
        };

        window.fetchNews = async () => {
            const newsContainer = document.getElementById('news-list');
            const refreshBtn = document.getElementById('news-refresh-icon');
            if (refreshBtn) refreshBtn.classList.add('animate-spin');
            try {
                const rssUrl = encodeURIComponent('https://news.google.com/rss?hl=ja&gl=JP&ceid=JP:ja');
                const endpoint = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;
                const response = await fetch(endpoint);
                const data = await response.json();
                if (data.status === 'ok') {
                    newsContainer.innerHTML = '';
                    data.items.slice(0, 10).forEach(item => {
                        const card = document.createElement('a');
                        card.href = item.link; card.target = "_blank";
                        card.className = "block news-card p-5 border border-transparent hover:border-white/10";
                        const date = new Date(item.pubDate).toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'});
                        card.innerHTML = `
                            <span class="text-xs font-bold uppercase tracking-wider text-blue-400">${item.author || 'Google News'} • ${date}</span>
                            <h3 class="text-lg font-bold mt-1 leading-tight">${item.title}</h3>
                            <p class="text-slate-400 text-sm mt-2 line-clamp-2">${item.description.replace(/<[^>]*>?/gm, '')}</p>
                        `;
                        newsContainer.appendChild(card);
                    });
                }
            } catch (error) { console.error("News Error:", error); }
            finally { if (refreshBtn) refreshBtn.classList.remove('animate-spin'); }
        };

        window.fetchWeather = async () => {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=35.98&longitude=140.15&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo`);
                const data = await response.json();
                const current = data.current_weather;
                const weatherMap = { 0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️', 45: '🌫️', 51: '🌧️', 61: '🌧️', 71: '❄️', 95: '⛈️' };
                document.getElementById('weather-temp').textContent = `${Math.round(current.temperature)}°C`;
                document.getElementById('weather-icon').textContent = weatherMap[current.weathercode] || '🌡️';
                const dailyContainer = document.getElementById('weekly-forecast');
                dailyContainer.innerHTML = '';
                const days = ['日', '月', '火', '水', '木', '金', '土'];
                data.daily.time.forEach((dateStr, i) => {
                    const date = new Date(dateStr);
                    const dayEl = document.createElement('div');
                    dayEl.className = 'flex-1 text-center p-3 rounded-2xl hover:bg-white/5 transition';
                    dayEl.innerHTML = `
                        <div class="text-xs text-slate-400 mb-1 font-bold">${i === 0 ? '今日' : days[date.getDay()]}</div>
                        <div class="text-2xl mb-1">${weatherMap[data.daily.weathercode[i]] || '🌡️'}</div>
                        <div class="text-sm font-bold">${Math.round(data.daily.temperature_2m_max[i])}°<span class="text-slate-500 font-normal ml-1">${Math.round(data.daily.temperature_2m_min[i])}°</span></div>
                    `;
                    dailyContainer.appendChild(dayEl);
                });
            } catch (e) { console.error("Weather Error:", e); }
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Yuji+Syuku&family=Kiwi+Maru:wght@400;500&family=Dela+Gothic+One&display=swap');
        :root {
            --bg-base: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --font-default: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", "Noto Sans JP", sans-serif;
        }
        body { font-family: var(--font-default); background: var(--bg-base); background-size: cover; background-position: center; background-attachment: fixed; color: #f8fafc; height: 100vh; overflow: hidden; transition: background 0.6s ease, font-family 0.3s ease; }
        .glass-card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 1.5rem; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        body.light-theme .glass-card { background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(0, 0, 0, 0.05); color: #1e293b; }
        .scroll-hide::-webkit-scrollbar { display: none; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .memo-input { background: transparent; border: none; resize: none; outline: none; width: 100%; height: 100%; color: inherit; font-size: 1rem; line-height: 1.6; }
        .news-card { transition: all 0.2s ease; border-radius: 1rem; }
        .news-card:hover { background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
        .ui-select { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); color: inherit; padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.85rem; }
        #theme-menu { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.1); transform: scale(0.95) translateY(10px); opacity: 0; pointer-events: none; }
        #theme-menu.active { transform: scale(1) translateY(0); opacity: 1; pointer-events: auto; }
        .theme-dot { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(128, 128, 128, 0.2); background-size: cover; }
        .current-theme-btn { width: 36px; height: 36px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.6); cursor: pointer; background-size: cover; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-[1600px] mx-auto h-full flex flex-col gap-6 animate-fade-in">
        <header class="flex justify-between items-end px-2">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">だっしゅぼーど</h1>
                <p id="current-date" class="text-slate-400 text-lg"></p>
            </div>
            <div class="flex items-center gap-6 text-right">
                <div class="flex flex-col items-end gap-1">
                    <span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold px-3">ふおんと</span>
                    <select id="font-selector" class="ui-select" onchange="changeFont(this.value)">
                        <option value='"Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo", "Noto Sans JP", sans-serif'>ゴシック</option>
                        <option value="'M PLUS Rounded 1c', sans-serif">まる文字</option>
                        <option value="'Yuji Syuku', serif">ふでもじ</option>
                        <option value="'Kiwi Maru', serif">かわ丸</option>
                        <option value="'Noto Serif JP', serif">おしゃんてぃ</option>
                        <option value="'Dela Gothic One', sans-serif">でかでか</option>
                    </select>
                </div>
                <div class="relative flex flex-col items-center gap-1">
                    <span class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">はいけい</span>
                    <div class="relative">
                        <div id="theme-menu" class="glass-card absolute bottom-full mb-3 right-0 flex items-center gap-3 px-4 py-3 min-w-[300px] overflow-x-auto scroll-hide z-50">
                            <label class="w-8 h-8 rounded-full bg-white/10 border-2 border-dashed border-white/30 flex items-center justify-center cursor-pointer">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                <input type="file" id="bg-upload" class="hidden" accept="image/*" onchange="handleFileUpload(this)">
                            </label>
                            <div class="theme-dot bg-slate-800" onclick="setTheme('dark')"></div>
                            <div class="theme-dot bg-indigo-600" onclick="setTheme('purple')"></div>
                            <div class="theme-dot bg-pink-300" onclick="setTheme('pastelPink')"></div>
                            <div class="theme-dot bg-blue-300" onclick="setTheme('pastelBlue')"></div>
                            <div class="theme-dot bg-emerald-300" onclick="setTheme('pastelGreen')"></div>
                            <div class="theme-dot bg-yellow-200" onclick="setTheme('cream')"></div>
                            <div class="theme-dot bg-purple-300" onclick="setTheme('lavender')"></div>
                            <div class="theme-dot bg-orange-400" onclick="setTheme('sunset')"></div>
                        </div>
                        <div id="current-theme-indicator" class="current-theme-btn" onclick="toggleThemeMenu()"></div>
                    </div>
                </div>
                <div id="clock" class="text-5xl font-bold tracking-tighter ml-4">00:00:00</div>
            </div>
        </header>
        <main class="grid grid-cols-12 grid-rows-6 gap-6 flex-1 min-h-0">
            <div class="col-span-3 row-span-5 flex flex-col gap-6">
                <div class="glass-card p-6 flex-shrink-0">
                    <span class="text-sm font-semibold text-slate-400 uppercase tracking-wider block mb-4">いまの天気</span>
                    <div class="flex items-center gap-4">
                        <div id="weather-icon" class="text-5xl">--</div>
                        <div>
                            <div id="weather-temp" class="text-4xl font-bold">--°C</div>
                        </div>
                    </div>
                </div>
                <div class="glass-card p-6 flex-1 flex flex-col min-h-0 overflow-hidden">
                    <span class="text-sm font-semibold text-slate-400 uppercase tracking-wider block mb-4">日本の人気曲 TOP10</span>
                    <div id="music-chart-list" class="flex-1 overflow-y-auto space-y-1 scroll-hide">
                        <div class="text-xs text-slate-500 p-4">読み込み中...</div>
                    </div>
                </div>
            </div>
            <div class="col-span-5 row-span-5 glass-card flex flex-col">
                <div class="p-6 border-b border-white/10 flex justify-between items-center">
                    <span class="text-sm font-semibold text-slate-400 uppercase tracking-wider">新しめなにゅーす</span>
                    <button onclick="window.fetchNews()" class="text-slate-400 hover:text-white transition">
                        <svg id="news-refresh-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                    </button>
                </div>
                <div id="news-list" class="flex-1 overflow-y-auto p-6 space-y-3 scroll-hide"></div>
            </div>
            <div class="col-span-4 row-span-5 glass-card flex flex-col">
                <div class="p-6 border-b border-white/10 flex justify-between items-center">
                    <span class="text-sm font-semibold text-slate-400 uppercase tracking-wider">めも</span>
                    <div class="flex gap-2">
                         <input type="text" id="search-input" placeholder="ググる..." class="bg-white/10 rounded-lg px-3 py-1 text-xs focus:outline-none border border-white/10 w-32">
                         <button onclick="performSearch()" class="text-slate-400 hover:text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </div>
                </div>
                <div class="flex-1 p-6">
                    <textarea id="memo-area" class="memo-input scroll-hide" placeholder="自由に書いてね..."></textarea>
                </div>
            </div>
            <div class="col-span-12 row-span-1 glass-card p-4 flex items-center">
                <div class="px-4 border-r border-white/10 mr-4">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block">予報</span>
                    <span class="text-sm font-bold whitespace-nowrap">週間てんき</span>
                </div>
                <div id="weekly-forecast" class="flex flex-1 justify-between px-2"></div>
            </div>
        </main>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toTimeString().split(' ')[0];
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('ja-JP', options);
        }
        setInterval(updateClock, 1000);
        updateClock();
        function changeFont(v) { document.body.style.fontFamily = v; }
        function performSearch() {
            const q = document.getElementById('search-input').value;
            if (q) window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
        }
        document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(); });
        const themes = {
            dark: 'linear-gradient(135deg, #1e293b 0%, #0f172a 100%)',
            purple: 'linear-gradient(135deg, #6366f1 0%, #312e81 100%)',
            pastelPink: 'linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%)',
            pastelBlue: 'linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%)',
            pastelGreen: 'linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%)',
            cream: 'linear-gradient(135deg, #fefce8 0%, #fef08a 100%)',
            lavender: 'linear-gradient(135deg, #f5f3ff 0%, #ddd6fe 100%)',
            sunset: 'linear-gradient(135deg, #fb923c 0%, #9a3412 100%)'
        };
        const themeMenu = document.getElementById('theme-menu');
        const indicator = document.getElementById('current-theme-indicator');
        function toggleThemeMenu() { themeMenu.classList.toggle('active'); }
        function setTheme(k) {
            const val = themes[k];
            document.body.style.background = val;
            indicator.style.background = val;
            const isLight = ['pastelPink','pastelBlue','pastelGreen','cream','lavender'].includes(k);
            document.body.classList.toggle('light-theme', isLight);
            document.body.style.color = isLight ? '#1e293b' : '#f8fafc';
            themeMenu.classList.remove('active');
        }
        function handleFileUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const bg = `url('${e.target.result}')`;
                    document.body.style.backgroundImage = bg;
                    document.body.style.backgroundSize = 'cover';
                    indicator.style.backgroundImage = bg;
                    themeMenu.classList.remove('active');
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        window.addEventListener('click', (e) => { if (!e.target.closest('.relative')) themeMenu.classList.remove('active'); });
        setTheme('dark');
    </script>
</body>
</html>
